<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz UPN</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <header class="top">
    <div>
      <h1>QUIZ UPN</h1>
      <p class="sub">Lectura diaria: 5 preguntas, gana XP y canjéala por medallas.</p>
    </div>
    <div class="corner">
      <div class="corner-row">
        <input type="range" id="vol" min="0" max="100" value="30" aria-label="Volumen de la música" title="Volumen">
        <button class="mini" id="music" title="Música de fondo">🔇</button>
        <button class="medalbar" id="medalbar" title="Mis medallas"></button>
      </div>
      <div class="medalpanel hidden" id="medalpanel"></div>
    </div>
  </header>

  <div class="stats">
    <div class="stat">🔥 <span id="streak">0</span><small>días de racha</small></div>
    <div class="stat">❤️ <span id="lives">3</span><small>vidas</small></div>
    <div class="stat">⭐ <span id="xp">0</span><small>XP disponible</small></div>
  </div>

  <section class="panel" id="reading">
    <div class="bar"><i id="prog"></i></div>
    <div class="rmeta" id="rmeta"></div>
    <h2 id="rtitle"></h2>
    <div class="rtext" id="rtext"></div>
    <div class="qbtns" id="qbtns"></div>
  </section>

  <section class="panel center hidden" id="done">
    <img class="foxface" id="foxdone" alt="Atoq Yachaq">
    <div class="big" id="gain">+0 XP</div>
    <p id="doneMsg"></p>
    <p class="sub">Vuelve mañana para una nueva lectura.</p>
  </section>

  <button class="reset" id="reset">Reiniciar progreso</button>
</main>

<div class="overlay hidden" id="ov">
  <div class="panel modal">
    <button class="xbtn" id="close" aria-label="Cerrar">✕</button>
    <div class="fox"><img class="foxface" id="fox" alt="Atoq Yachaq"><div class="bubble" id="q"></div></div>
    <div class="opts" id="opts"></div>
    <div class="exp" id="exp"></div>
    <button class="btn hidden" id="next">Continuar</button>
  </div>
</div>

<audio id="bgm" src="assets/musica.mp3" loop preload="none"></audio>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
